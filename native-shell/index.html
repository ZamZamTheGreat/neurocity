<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#171916" />
    <title>NeuroCity</title>
    <style>
      *{box-sizing:border-box}body{display:grid;min-height:100vh;margin:0;place-items:center;padding:24px;background:#171916;color:#f8f6ef;font:16px/1.5 system-ui,sans-serif}.state{max-width:360px;text-align:center}.mark{display:grid;width:64px;height:64px;margin:0 auto 20px;place-items:center;border:1px solid #d9b45c55;border-radius:18px;background:#24241f;color:#d9b45c;font-size:28px;font-weight:900}.state h1{margin:0 0 8px}.state p{margin:0;color:#b8bcb7}.state button{min-height:46px;margin-top:22px;padding:0 18px;border:0;border-radius:10px;background:#c99a3d;color:#17130b;font:inherit;font-weight:800}
    </style>
  </head>
  <body>
    <main class="state"><div class="mark">N</div><h1>NeuroCity is offline</h1><p>Check your connection and try again.</p><button onclick="location.reload()">Try again</button></main>
  </body>
</html>
