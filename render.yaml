services:
  - type: web
    name: neurocity
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run db:migrate && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: ADMIN_EMAIL
        value: sergejwitbooi@gmail.com
