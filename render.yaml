services:
  - type: web
    name: neurocity
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    # Free Render web services do not support a pre-deploy command. Build first,
    # then apply the committed, forward-only migrations before releasing the
    # new server. A migration failure stops the deploy and keeps the old release.
    buildCommand: npm ci --include=dev && npm run build && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: ADMIN_EMAIL
        value: sergejwitbooi@gmail.com
      - key: DB_POOL_MAX
        value: 10
