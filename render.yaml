services:
  - type: web
    name: neurocity
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    # Database migrations run from a separate trusted operator/CI environment.
    # The web service must never receive DATABASE_MIGRATION_URL.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: ADMIN_EMAIL
        value: sergejwitbooi@gmail.com
      - key: DB_POOL_MAX
        value: 10
