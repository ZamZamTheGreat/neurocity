<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#07111f">
    <title>NeuroCity — You’re offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#07111f;color:#f7fbff;font-family:system-ui,-apple-system,sans-serif}.card{width:min(100%,520px);padding:36px;border:1px solid #263446;border-radius:24px;background:#0b1726;box-shadow:0 18px 50px #0008}.mark{width:62px;height:62px;border-radius:18px;object-fit:cover}h1{margin:24px 0 10px;font-size:clamp(2rem,8vw,3rem);line-height:1}p{color:#aab7c5;line-height:1.6}button{margin-top:12px;min-height:46px;padding:0 20px;border:0;border-radius:999px;background:#18c98e;color:#04130e;font:inherit;font-weight:800;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <img class="mark" src="/branding/neurocity-mark.png" alt="">
      <h1>You’re offline.</h1>
      <p>Reconnect to continue shopping, manage orders, or use your NeuroCity dashboard. We keep live account, stock, order, and payment information on the server so it stays accurate and secure.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
