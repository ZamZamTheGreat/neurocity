<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#17131f">
    <title>NeuroCity — You’re offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f5f1;color:#17131f;font-family:system-ui,-apple-system,sans-serif}.card{width:min(100%,520px);padding:36px;border:1px solid #ded8e7;border-radius:24px;background:#fff;box-shadow:0 18px 50px #2b21401a}.mark{display:grid;place-items:center;width:58px;height:58px;border-radius:18px;background:#17131f;color:#f2b632;font-size:22px;font-weight:900}h1{margin:24px 0 10px;font-size:clamp(2rem,8vw,3rem);line-height:1}p{color:#665f6e;line-height:1.6}button{margin-top:12px;min-height:46px;padding:0 20px;border:0;border-radius:999px;background:#5a3ca0;color:#fff;font:inherit;font-weight:750;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">NC</div>
      <h1>You’re offline.</h1>
      <p>Reconnect to continue shopping, manage orders, or use your NeuroCity dashboard. We keep live account, stock, order, and payment information on the server so it stays accurate and secure.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
